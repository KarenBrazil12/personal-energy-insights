name: Validate project narrative

on:
  pull_request:
    paths:
      - ".project-narrative.json"
      - "narrative/**"
      - "Narrative.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate fragments and compiled narrative
        uses: jamiemitchellconsultants/Narrative@4088093e522bd29201d33b7b47ca000239190368
        with:
          mode: check
