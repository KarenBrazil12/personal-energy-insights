name: Validate project narrative

on:
  pull_request:
    paths:
      - ".project-narrative.json"
      - "narrative/**"
      - "Narrative.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate fragments and compiled narrative
        uses: jamiemitchellconsultants/Narrative@4f143bcf3f9cfd45a51aed41bdd26512f6856534
        with:
          mode: check
